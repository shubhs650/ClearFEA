# Local services for Phase 0. The API and web app run on the host (wrangler dev,
# Vite); the worker runs here and reaches the API through host.docker.internal.
#
#   docker compose -f infra/docker-compose.yml up --build worker
#
# CLEARFEA_WORKER_TOKEN must match WORKER_TOKEN in apps/api/.dev.vars.

name: clearfea

services:
  worker:
    build:
      context: ../worker
      # The units table, packages/spec/units.json (see worker/Dockerfile).
      additional_contexts:
        spec: ../packages/spec
      # The source commit, recorded with every run (ADR-032); infra/dev.sh sets it.
      args:
        CLEARFEA_COMMIT: ${CLEARFEA_COMMIT:-}
      # Optional CA bundle for builds behind a TLS-intercepting proxy (ADR-012).
      # Point CLEARFEA_BUILD_CA at it; the default is an empty file, which the build ignores.
      secrets:
        - extra_ca
    image: clearfea-worker
    environment:
      CLEARFEA_API_URL: ${CLEARFEA_API_URL:-http://host.docker.internal:8787}
      CLEARFEA_WORKER_TOKEN: ${CLEARFEA_WORKER_TOKEN:-local-dev-worker-token}
      CLEARFEA_WORKER_ID: ${CLEARFEA_WORKER_ID:-local-worker}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No memory limit on the container: the worker holds each solve to its machine size's
    # memory itself (ADR-082), and a container cap below the smallest size (8 GiB) would kill
    # runs the size has room for (ADR-088). The solver runs on one thread (ADR-048).
    cpus: 2
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

secrets:
  extra_ca:
    file: ${CLEARFEA_BUILD_CA:-/dev/null}
