# V-02: square cantilever in inches, clamped at x = 0, loaded on the last inch of its top.
# Reference values and their derivation: reference.md. Layout: verification/README.md.
id: V-02
title: Cantilever, end load
analysis: linear_static
features: [fixed support, force, mixed input units]
geometry:
  unit: in # declared in the STEP file and confirmed after upload
# Each face by its bounding box, in the geometry's unit.
faces:
  clamped-end: { min: [0, 0, 0], max: [0, 1, 1] }
  free-end: { min: [10, 0, 0], max: [10, 1, 1] }
  top: { min: [0, 1, 0], max: [9, 1, 1] }
  end-patch: { min: [9, 1, 0], max: [10, 1, 1] }
  bottom: { min: [0, 0, 0], max: [10, 0, 1] }
mesh:
  coarse: { value: 5, unit: mm } # about 7,000 elements, five through the depth
  full: { value: 2.5, unit: mm } # about 51,000 elements
checks:
  - name: Tip deflection (mean over the free end)
    quantity: displacement.y
    face: free-end
    reference: { value: -0.0643128, unit: in }
    # The solid model's clamp holds the whole root face, which beam theory does not; that
    # makes it about 0.7 percent stiffer at every mesh size (reference.md). Not loosened.
    tolerance: { coarse: 0.02, full: 0.015 }
  - name: Bending stress on top at mid-length
    quantity: vonMises
    face: top
    box: { min: [4.75, 1, 0], max: [5.25, 1, 1] }
    reference: { value: 13500, unit: psi }
    tolerance: { coarse: 0.01, full: 0.005 }
  - name: Bending stress underneath at mid-length
    quantity: vonMises
    face: bottom
    box: { min: [4.75, 0, 0], max: [5.25, 0, 1] }
    reference: { value: 13500, unit: psi }
    tolerance: { coarse: 0.01, full: 0.005 }
  - name: Clamp carries the end load
    quantity: reaction.y
    support: fixed-1
    reference: { value: 500, unit: lbf }
    tolerance: { coarse: 0.001, full: 0.001 }
