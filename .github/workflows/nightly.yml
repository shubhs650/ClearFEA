# Nightly tier placeholder. `make verify` and `make e2e` run at the end of each milestone instead
# (phase-end.yml, ADR-037); this schedule stays so a nightly run can return without a new workflow.
# See docs/VERIFICATION.md for the tiers.
name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    name: Nightly suites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "Nothing runs nightly. make verify and make e2e run at each milestone's end (phase-end.yml)."
