# SPDX-License-Identifier: AGPL-3.0-or-later
# Deploy: every push to main goes live at clearfea.triyalabs.com (ADR-095 item 9, M10.2).
# The fast tier first; then the solver image on AWS when its source changed (M10.8, ADR-101); then the production
# configuration (ADR-096), D1 migrations, the Worker with the built web app and the secrets copied from GitHub,
# and a health check that the site reports the commit just deployed.
# Run it by hand from the Actions tab for the first deploy, or from an older tag to roll back
# (docs/DEPLOYMENT.md sections 6.1 and 7.2). Settings come from GitHub repository secrets and
# variables (DEPLOYMENT.md section 5); none is stored in the repository.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in merge order; a deploy is never cancelled halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SITE_URL: https://clearfea.triyalabs.com

jobs:
  test:
    name: Fast tier
    uses: ./.github/workflows/fast.yml

  # The solver image (M10.8, ADR-101): built and pushed to the stack's image store (ECR) only
  # when no image of this worker/ and packages/spec/ source is there yet, then a new revision of
  # each machine definition that runs it. The API starts the newest revision, so new machines
  # take the new image while a machine already running finishes its job on the old one.
  worker:
    name: Solver image
    needs: test
    # Until AWS is set up (DEPLOYMENT.md section 4), merges skip it; a run started by hand runs
    # it, names what is missing and goes on to the site, which the first deploy needs.
    if: github.event_name == 'workflow_dispatch' || vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    # A build without cache compiles CalculiX with PaStiX: about half an hour.
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # GitHub's OIDC token for the deploy role; no AWS keys are stored
    environment:
      name: production
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      STACK_NAME: clearfea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the deploy settings
        id: settings
        run: |
          missing=""
          [ -n "$AWS_REGION" ] || missing="$missing variable AWS_REGION (section 4.2);"
          [ -n "$AWS_DEPLOY_ROLE_ARN" ] || missing="$missing variable AWS_DEPLOY_ROLE_ARN (section 4.3);"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$AWS_REGION$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "::warning::The solver image was not deployed: AWS is not set up yet. Add in GitHub (Settings, Secrets and variables, Actions), as docs/DEPLOYMENT.md says:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Nothing was deployed. Add in GitHub (Settings, Secrets and variables, Actions), as docs/DEPLOYMENT.md says:$missing"
            exit 1
          fi

      - name: Configure AWS credentials
        id: aws
        if: steps.settings.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: clearfea-deploy-${{ github.run_id }}

      # When AWS refuses the role, show who GitHub says this run is, so it can be compared with
      # the role's trust policy (DEPLOYMENT.md section 8). Prints the token's claims, never the token.
      - name: Show the identity AWS was given
        if: failure() && steps.aws.outcome == 'failure'
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          printf '%s' "$payload" | base64 -d | jq '{sub, aud, iss, repository, environment, ref}'
          echo "::error::AWS refused this identity. The deploy role's trust policy must allow the sub above (DEPLOYMENT.md section 8)."

      - name: Find the image store
        id: stack
        if: steps.settings.outputs.ready == 'true'
        run: infra/aws/worker-image.sh stack "$STACK_NAME" >> "$GITHUB_OUTPUT"

      - name: Look for an image of this source
        id: image
        if: steps.settings.outputs.ready == 'true'
        env:
          REPOSITORY: ${{ steps.stack.outputs.repository }}
        run: |
          tag=$(infra/aws/worker-image.sh tag)
          digest=$(infra/aws/worker-image.sh find "$REPOSITORY" "$tag")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          if [ -n "$digest" ]; then
            echo "$REPOSITORY:$tag is already pushed ($digest): worker/ and packages/spec/ are unchanged, nothing to build."
          else
            echo "No image for this source yet: building $REPOSITORY:$tag."
          fi

      - name: Sign in to the image store
        if: steps.settings.outputs.ready == 'true' && steps.image.outputs.digest == ''
        env:
          REPOSITORY_URI: ${{ steps.stack.outputs.repository_uri }}
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "${REPOSITORY_URI%%/*}"

      - name: Set up Docker Buildx
        if: steps.settings.outputs.ready == 'true' && steps.image.outputs.digest == ''
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      # As `make worker-image` builds it, from the same Dockerfile; the commit it was built from
      # is what the worker reports (ADR-032). The layer cache lives in GitHub's Actions cache.
      - name: Build and push the image
        id: build
        if: steps.settings.outputs.ready == 'true' && steps.image.outputs.digest == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: worker
          build-contexts: spec=packages/spec
          build-args: CLEARFEA_COMMIT=${{ github.sha }}
          tags: ${{ steps.stack.outputs.repository_uri }}:${{ steps.image.outputs.tag }}
          push: true
          # One plain image manifest per push, so the image store's keep-ten rule counts images.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=worker-image
          cache-to: type=gha,scope=worker-image,mode=max

      # The stack's machine definitions name :latest until the first revision below; keeping
      # it on the deployed image means a stack update that re-creates one starts this image too.
      - name: Point latest at the image
        id: deployed
        if: steps.settings.outputs.ready == 'true'
        env:
          REPOSITORY: ${{ steps.stack.outputs.repository }}
          REPOSITORY_URI: ${{ steps.stack.outputs.repository_uri }}
          DIGEST: ${{ steps.image.outputs.digest || steps.build.outputs.digest }}
        run: |
          [ -n "$DIGEST" ] || { echo "::error::The image build reported no digest."; exit 1; }
          infra/aws/worker-image.sh latest "$REPOSITORY" "$DIGEST"
          echo "image=$REPOSITORY_URI@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Register the machine definitions
        if: steps.settings.outputs.ready == 'true'
        env:
          IMAGE: ${{ steps.deployed.outputs.image }}
        run: infra/aws/worker-image.sh register "$IMAGE"

  site:
    name: Site and API
    # After the solver image, so new machines can serve the new API; when that job is skipped
    # (AWS not set up) the site still deploys, and when it fails nothing more is deployed.
    needs: [test, worker]
    # Until the Cloudflare setup is done (DEPLOYMENT.md section 1), merges skip the deploy instead
    # of failing on main; a run started by hand always runs and names what is missing.
    if: >-
      !cancelled() && needs.test.result == 'success'
      && (needs.worker.result == 'success' || needs.worker.result == 'skipped')
      && (github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_ACCOUNT_ID != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://clearfea.triyalabs.com
    defaults:
      run:
        working-directory: apps/api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the deploy settings
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing secret CLOUDFLARE_API_TOKEN (section 1.6);"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing variable CLOUDFLARE_ACCOUNT_ID (section 1.5);"
          [ -n "$CLOUDFLARE_D1_DATABASE_ID" ] || missing="$missing variable CLOUDFLARE_D1_DATABASE_ID (section 1.4);"
          if [ -n "$missing" ]; then
            echo "::error::Nothing was deployed. Add in GitHub (Settings, Secrets and variables, Actions), as docs/DEPLOYMENT.md says:$missing"
            exit 1
          fi
          if ! grep -q '"deploy:config"' package.json; then
            echo "::error::Nothing was deployed. apps/api/package.json has no deploy:config script, which writes the production configuration (task M10.1, ADR-096)."
            exit 1
          fi

      # pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Authenticate to Cloudflare
        run: pnpm exec wrangler whoami

      - name: Build the web app
        run: pnpm --filter @clearfea/web build

      # Writes the git-ignored wrangler.production.json from wrangler.jsonc with the database id
      # and the commit the health check looks for (ADR-096). Needs the built web app.
      - name: Write the production configuration
        env:
          CLEARFEA_COMMIT: ${{ github.sha }}
        run: pnpm run deploy:config

      # Forward-only; D1 Time Travel restores the database if a migration goes wrong (ADR-095 item 9).
      - name: Apply database migrations
        run: pnpm run deploy:migrate

      # Only the secrets that are set are sent; ones added later (M10.3, M10.5, M10.7) arrive with
      # the next deploy. Uploaded with the code, so a version never runs without its secrets.
      - name: Collect the Worker secrets
        env:
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_LAUNCHER_ACCESS_KEY_ID: ${{ secrets.AWS_LAUNCHER_ACCESS_KEY_ID }}
          AWS_LAUNCHER_SECRET_ACCESS_KEY: ${{ secrets.AWS_LAUNCHER_SECRET_ACCESS_KEY }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          umask 077
          jq -n 'env | with_entries(select(.value != "" and (.key | IN(
            "WORKER_TOKEN", "BETTER_AUTH_SECRET", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET",
            "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY", "AWS_LAUNCHER_ACCESS_KEY_ID",
            "AWS_LAUNCHER_SECRET_ACCESS_KEY", "ADMIN_EMAIL", "AWS_REGION"))))' \
            > "$RUNNER_TEMP/worker-secrets.json"
          echo "Secrets to upload: $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/worker-secrets.json")"

      - name: Deploy the Worker
        run: pnpm run deploy:worker --secrets-file "$RUNNER_TEMP/worker-secrets.json"

      - name: Remove the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"

      # A new custom domain can take a few minutes for its certificate on the first deploy.
      - name: Check the site runs this commit
        run: |
          for attempt in $(seq 1 30); do
            body=$(curl -sS --max-time 10 "$SITE_URL/api/health" || true)
            commit=$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            status=$(printf '%s' "$body" | jq -r '.status // empty' 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ] && [ "$status" = "ok" ]; then
              echo "$SITE_URL runs $GITHUB_SHA: $body"
              exit 0
            fi
            echo "Attempt $attempt: not yet ($body)"
            sleep 10
          done
          echo "::error::$SITE_URL/api/health did not report status ok and commit $GITHUB_SHA within 5 minutes. The Worker was uploaded; check its logs in Cloudflare (Compute, Workers, clearfea)."
          exit 1
