# SPDX-License-Identifier: AGPL-3.0-or-later
# Deploy: every push to main goes live at clearfea.triyalabs.com (ADR-095 item 9, M10.2).
# The fast tier first; then D1 migrations, the Worker with the built web app and the secrets
# copied from GitHub, and a health check that the site reports the commit just deployed.
# Run it by hand from the Actions tab for the first deploy, or from an older tag to roll back
# (docs/DEPLOYMENT.md sections 6.1 and 7.2). Settings come from GitHub repository secrets and
# variables (DEPLOYMENT.md section 5); none is stored in the repository.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in merge order; a deploy is never cancelled halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SITE_URL: https://clearfea.triyalabs.com

jobs:
  test:
    name: Fast tier
    uses: ./.github/workflows/fast.yml

  # M10.8 adds the worker image job here (build, push to ECR, task definitions), before this one.

  site:
    name: Site and API
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://clearfea.triyalabs.com
    defaults:
      run:
        working-directory: apps/api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the deploy settings
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing secret CLOUDFLARE_API_TOKEN (section 1.6);"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing variable CLOUDFLARE_ACCOUNT_ID (section 1.5);"
          [ -n "$CLOUDFLARE_D1_DATABASE_ID" ] || missing="$missing variable CLOUDFLARE_D1_DATABASE_ID (section 1.4);"
          if [ -n "$missing" ]; then
            echo "::error::Nothing was deployed. Add in GitHub (Settings, Secrets and variables, Actions), as docs/DEPLOYMENT.md says:$missing"
            exit 1
          fi
          if ! grep -q '__CLOUDFLARE_D1_DATABASE_ID__' wrangler.jsonc; then
            echo "::error::Nothing was deployed. apps/api/wrangler.jsonc has no production configuration with the __CLOUDFLARE_D1_DATABASE_ID__ placeholder (task M10.1)."
            exit 1
          fi

      # pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Authenticate to Cloudflare
        run: pnpm exec wrangler whoami

      # The database id is a GitHub variable, filled in on the runner's copy only.
      - name: Fill in the production database id
        run: sed -i "s/__CLOUDFLARE_D1_DATABASE_ID__/${CLOUDFLARE_D1_DATABASE_ID}/" wrangler.jsonc

      - name: Build the web app
        run: pnpm --filter @clearfea/web build

      # Forward-only; D1 Time Travel restores the database if a migration goes wrong (ADR-095 item 9).
      - name: Apply database migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote --env production

      # Only the secrets that are set are sent; ones added later (M10.3, M10.5, M10.7) arrive with
      # the next deploy. Uploaded with the code, so a version never runs without its secrets.
      - name: Collect the Worker secrets
        env:
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_LAUNCHER_ACCESS_KEY_ID: ${{ secrets.AWS_LAUNCHER_ACCESS_KEY_ID }}
          AWS_LAUNCHER_SECRET_ACCESS_KEY: ${{ secrets.AWS_LAUNCHER_SECRET_ACCESS_KEY }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          umask 077
          jq -n 'env | with_entries(select(.value != "" and (.key | IN(
            "WORKER_TOKEN", "BETTER_AUTH_SECRET", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET",
            "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY", "AWS_LAUNCHER_ACCESS_KEY_ID",
            "AWS_LAUNCHER_SECRET_ACCESS_KEY", "ADMIN_EMAIL", "AWS_REGION"))))' \
            > "$RUNNER_TEMP/worker-secrets.json"
          echo "Secrets to upload: $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/worker-secrets.json")"

      - name: Deploy the Worker
        run: >-
          pnpm exec wrangler deploy --env production
          --var "CLEARFEA_COMMIT:${GITHUB_SHA}"
          --secrets-file "$RUNNER_TEMP/worker-secrets.json"

      - name: Remove the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"

      # A new custom domain can take a few minutes for its certificate on the first deploy.
      - name: Check the site runs this commit
        run: |
          for attempt in $(seq 1 30); do
            body=$(curl -sS --max-time 10 "$SITE_URL/api/health" || true)
            commit=$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            status=$(printf '%s' "$body" | jq -r '.status // empty' 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ] && [ "$status" = "ok" ]; then
              echo "$SITE_URL runs $GITHUB_SHA: $body"
              exit 0
            fi
            echo "Attempt $attempt: not yet ($body)"
            sleep 10
          done
          echo "::error::$SITE_URL/api/health did not report status ok and commit $GITHUB_SHA within 5 minutes. The Worker was uploaded; check its logs in Cloudflare (Compute, Workers, clearfea)."
          exit 1
